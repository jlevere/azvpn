[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/ipc",
    "crates/profile",
    "crates/auth",
    "crates/openvpn",
    "crates/tunnel-darwin",
    "crates/tunnel-linux",
    "crates/tunnel-windows",
    "crates/xtask",
]
# Don't pull xtask into `cargo build --workspace`: it's project-internal
# release tooling, not shippable code, and dragging its compile time
# into every dev `cargo build` is the easiest way to make people hate
# it. The `cargo xtask <cmd>` alias still works because aliases run
# `cargo run -p xtask`, which is explicit-membership.
default-members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/ipc",
    "crates/profile",
    "crates/auth",
    "crates/openvpn",
    "crates/tunnel-darwin",
    "crates/tunnel-linux",
    "crates/tunnel-windows",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jlevere/azvpn"
# Internal workspace crates are not published to crates.io — only the
# `azvpn` CLI binary is the user-facing artifact, shipped as static
# binary / .deb / .rpm. cargo-deny needs this to allow wildcard path
# deps between workspace members.
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Linux-only — structured journald output (key=value fields searchable
# via `journalctl AZVPND_PROFILE=/path`). Used by the daemon when
# systemd has piped stdout/stderr to the journal (detected via the
# JOURNAL_STREAM env var). The crate compiles on non-Linux as a stub.
tracing-journald = "0.3"
# Linux-only — `sd_notify(READY=1)` after the daemon's socket is bound.
# Needed because the systemd unit uses Type=notify; without the
# ready signal systemd flags startup as failed after the timeout.
sd-notify = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# 4.x split into keyring-core + per-platform backend crates; the
# combined-crate 3.x API is simpler for our needs (one entry per
# (service, user) tuple). Features are platform-gated internally so
# enabling all three is safe — only the relevant one activates per
# target. `crypto-rust` keeps the Linux secret-service envelope
# crypto in pure Rust (avoids the OpenSSL link).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
open = "5"
tempfile = "3"
base64 = "0.22"
sha1 = "0.11"
pem = "3"
url = "2"
hickory-proto = { version = "0.24", default-features = false }
net-route = "0.4"
libc = "0.2"
tarpc = { version = "0.37", features = ["full"] }
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
# Async-first exponential backoff. Used by reqwest-retry, opendal,
# etc. — iterator-yielding-Duration API is a clean fit for our
# match-on-AttemptOutcome retry loop. `std-category` keeps it
# lightweight (just `Duration`, no extra runtime dep).
backon = { version = "1", default-features = false, features = ["std-blocking-sleep"] }
# Network-interface change watcher. macOS uses SCNetworkReachability,
# Linux uses rtnetlink RTMGRP_LINK, Windows uses NotifyIpInterfaceChange
# — all wrapped behind one Stream<Item = IfEvent> trait. Same maintainer
# (mxinden) and used in libp2p, so it tracks Tokio versions well.
if-watch = { version = "3", default-features = false, features = ["tokio"] }
uzers = { version = "0.12", default-features = false }
# Wrap AAD bearer tokens / refresh tokens in `SecretString`: no Debug
# impl (prints `[REDACTED]`), zeroes on drop, `.expose_secret()` is
# the explicit unwrap. Prevents accidental log leaks via tracing
# fields or struct Debug. Wire-side: SecretString serializes as a
# plain String for tarpc/bincode — the IPC channel itself is the
# transport-level security.
secrecy = { version = "0.10", features = ["serde"] }
# `directories` gives ProjectDirs::from("com", "jlevere", "azvpn") that
# produces OS-idiomatic per-app paths: bundle-ID-shaped subdirs on
# macOS (`com.jlevere.azvpn`), `<vendor>/<app>` on Windows, XDG basedir
# on Linux. Replaces hand-rolled `~/Library/Application Support/<X>` etc.
directories = "5"
# Pure-Rust D-Bus. No libdbus-1 C dep (sidesteps the cross-compile
# pain we hit with libdbus-sys). Tokio-native via `tokio` feature.
# Used by tunnel-linux to talk to systemd-resolved + systemd1 over
# the system bus — per the no-shelling-out rule, we don't reach for
# `resolvectl` / `systemctl` from azvpn.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# `getifaddrs(3)` wrapper. We need it on Linux to find the tun
# interface index that systemd-resolved's `SetLinkDNS` expects, by
# matching the openvpn-assigned tunnel IP. Pure-Rust binding;
# cross-platform so it also works for any future macOS/Windows code
# that needs the same.
if-addrs = "0.13"

# ─── Windows-only deps (workspace pins; consumed via per-crate
# `[target.'cfg(target_os = "windows")']` blocks) ────────────────
#
# `windows-service` — Mullvad's SCM wrapper (dual MIT/Apache-2.0).
# `service_dispatcher`, `define_windows_service!`,
# `service_control_handler`, `ServiceManager`. Saves ~200 LOC of
# windows-sys::Services boilerplate per app. See docs/windows-plan.md
# §2.4.
windows-service = "0.8"
# Raw Win32 FFI. Pulled in for: SCM dependencies (`Win32_System_Services`),
# LSA logon enumeration in the hibernation detector
# (`Win32_Security_Authentication_Identity`), `RefreshPolicyEx` for
# NRPT GP refresh (`Win32_System_GroupPolicy`), admin-check
# (`Win32_Security`), and named-pipe security attributes
# (`Win32_Security`, `Win32_System_Pipes`). Cheap to compile vs the
# higher-level `windows` crate. Per-crate Cargo.toml enables only
# the feature subset that crate actually uses.
windows-sys = "0.59"
# Higher-level registry helper. Used for NRPT registry writes
# (`HKLM\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters\
# DnsPolicyConfig\<guid>`). Less unsafe than driving the raw
# windows-sys Registry APIs.
winreg = "0.55"
# UTF-16 marshalling for Win32 calls (`WideCString::from_str`).
# Required for any string passed across a Win32 API boundary.
widestring = "1"
# UUID v4 generation for NRPT rule subkey names. `v4` pulls in
# `getrandom`; pure-Rust, no Win32 surface, no `unsafe` in our
# tree (CoCreateGuid was what we used before, this drops it).
# `fast-rng` swaps to a faster (but still cryptographically OK)
# PRNG seeded from getrandom.
uuid = { version = "1", default-features = false, features = ["v4", "fast-rng"] }
# Rolling-file logger for the daemon on Windows (no journald).
# Writes to `C:\ProgramData\azvpn\logs\daemon.log` with size-based
# rotation. Track G.7 prerequisite on Windows.
tracing-appender = "0.2"
# `async fn` in trait, dyn-compatible. The `DnsManager` trait is
# `Box<dyn>`'d through `core::dns`, and the Linux backend calls
# zbus's async D-Bus client — async-trait is the well-trodden
# dtolnay-maintained crate that makes both compose.
async-trait = "0.1"

azvpn-core = { path = "crates/core" }
azvpn-ipc = { path = "crates/ipc" }
azvpn-profile = { path = "crates/profile" }
azvpn-auth = { path = "crates/auth" }
azvpn-openvpn = { path = "crates/openvpn" }
azvpn-tunnel-darwin = { path = "crates/tunnel-darwin" }
azvpn-tunnel-linux = { path = "crates/tunnel-linux" }
azvpn-tunnel-windows = { path = "crates/tunnel-windows" }

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# clippy 1.83+ flags numbered/bulleted list continuation lines that
# don't satisfy its Markdown indentation expectations. We don't ship
# rendered docs; the lint produces noisy false positives on aligned
# lists.
doc_lazy_continuation = "allow"

