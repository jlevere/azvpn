[workspace]
members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/ipc",
    "crates/profile",
    "crates/auth",
    "crates/openvpn",
    "crates/tunnel-darwin",
    "crates/tunnel-linux",
    "crates/tunnel-windows",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jlevere/azvpn"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
# 4.x split into keyring-core + per-platform backend crates; the
# combined-crate 3.x API is simpler for our needs (one entry per
# (service, user) tuple). Features are platform-gated internally so
# enabling all three is safe — only the relevant one activates per
# target. `crypto-rust` keeps the Linux secret-service envelope
# crypto in pure Rust (avoids the OpenSSL link).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
open = "5"
tempfile = "3"
system-configuration = "0.7"
base64 = "0.22"
sha1 = "0.11"
pem = "3"
url = "2"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
net-route = "0.4"
libc = "0.2"
tarpc = { version = "0.37", features = ["full"] }
futures = "0.3"
ipnet = { version = "2", features = ["serde"] }
# Async-first exponential backoff. Used by reqwest-retry, opendal,
# etc. — iterator-yielding-Duration API is a clean fit for our
# match-on-AttemptOutcome retry loop. `std-category` keeps it
# lightweight (just `Duration`, no extra runtime dep).
backon = { version = "1", default-features = false, features = ["std-blocking-sleep"] }
# Network-interface change watcher. macOS uses SCNetworkReachability,
# Linux uses rtnetlink RTMGRP_LINK, Windows uses NotifyIpInterfaceChange
# — all wrapped behind one Stream<Item = IfEvent> trait. Same maintainer
# (mxinden) and used in libp2p, so it tracks Tokio versions well.
if-watch = { version = "3", default-features = false, features = ["tokio"] }
uzers = { version = "0.12", default-features = false }
dirs = "5"

azvpn-core = { path = "crates/core" }
azvpn-ipc = { path = "crates/ipc" }
azvpn-profile = { path = "crates/profile" }
azvpn-auth = { path = "crates/auth" }
azvpn-openvpn = { path = "crates/openvpn" }
azvpn-tunnel-darwin = { path = "crates/tunnel-darwin" }
azvpn-tunnel-linux = { path = "crates/tunnel-linux" }
azvpn-tunnel-windows = { path = "crates/tunnel-windows" }

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

# `dist init` reads this when generating release workflows. Targets here
# are the matrix we ship binaries for; installers default to the shapes
# package managers actually consume on each platform. Keep this aligned
# with `packaging/` — adding a target here usually means a parallel
# template under that directory.
[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
# `pr-run-mode = "plan"` keeps PRs out of the release pipeline — only tag
# pushes trigger the actual build. `install-path` defaults to ~/.cargo/bin
# which is wrong for a system VPN client; flip to a system bindir.
pr-run-mode = "plan"
install-path = "/usr/local/bin"
