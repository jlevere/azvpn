[package]
name = "azvpn"
version = "0.1.0"
description = "Cross-platform Azure VPN client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "azvpn"
path = "src/main.rs"

# `cargo bundle --release` produces a `.app` wrapping the CLI. We're not a
# real GUI — the bundle exists so we can ship a `/Applications` drop-in for
# users who don't have a CLI workflow, and so a future GUI target slots in
# without re-doing this scaffolding. Icon / category / Info.plist tweaks
# live alongside under `packaging/macos/`.
# `cargo deb` produces a Debian package containing the CLI, the daemon,
# the patched openvpn we bundle (built separately via Nix in CI and
# dropped at target/openvpn-azvpn/openvpn before `cargo deb` runs),
# the systemd unit, and the maintainer scripts that create the
# `azvpn` group + state dirs. See packaging/deb/.
#
# Paths are relative to this Cargo.toml (crates/cli/), which is why the
# workspace-level artifacts are reached via ../../.
[package.metadata.deb]
name = "azvpn"
maintainer = "Jackson Leverett <jacksonleverett@gmail.com>"
section = "net"
priority = "optional"
# $auto picks up libc + small dynamic deps for azvpn/azvpnd (we use
# rustls everywhere — no libssl). systemd is the unit prerequisite.
depends = "$auto, systemd"
extended-description = """
A from-scratch reimplementation of the Microsoft Azure VPN Client as a
portable Rust CLI/library. Connects to Azure Virtual WAN P2S OpenVPN
gateways with Microsoft Entra ID (AAD) or certificate authentication.

Bundles a patched openvpn at /usr/libexec/azvpn/openvpn — stock
openvpn 2.6 truncates AAD bearer tokens during the TLS handshake."""
assets = [
    ["../../target/release/azvpn", "usr/bin/", "755"],
    ["../../target/release/azvpnd", "usr/sbin/", "755"],
    ["../../target/openvpn-azvpn/openvpn", "usr/libexec/azvpn/openvpn", "755"],
    ["../../packaging/deb/azvpn.service", "lib/systemd/system/azvpn.service", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/azvpn/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/azvpn/LICENSE-APACHE", "644"],
    ["../../README.md", "usr/share/doc/azvpn/README.md", "644"],
]
maintainer-scripts = "../../packaging/deb/scripts"
# enable=false / start=false leaves the unit installed but inactive —
# admins have to `systemctl enable --now azvpn.service` themselves
# after `usermod -aG azvpn $USER`. Matches Tailscale's pattern; avoids
# surprising the operator with an immediately-running daemon.
systemd-units = { enable = false, start = false, restart-after-upgrade = true }

# `cargo generate-rpm` is the RPM-family counterpart of cargo-deb. Same
# input artifacts (target/release/{azvpn,azvpnd}, target/openvpn-azvpn/openvpn,
# packaging/deb/azvpn.service), different metadata shape. Targets:
# Fedora 39+, RHEL 9, Amazon Linux 2023, Azure Linux 3.
#
# Paths are absolute from the workspace root, not relative — unlike
# cargo-deb. cargo-generate-rpm resolves them itself.
[package.metadata.generate-rpm]
name = "azvpn"
summary = "Cross-platform Azure VPN client"
# auto_req = "auto" makes cargo-generate-rpm scan the binaries' dynamic
# imports and emit per-soname Requires (libc.so.6, libdbus-1.so.3, ...).
# Same flow as cargo-deb's "$auto".
auto-req = "auto"
assets = [
    { source = "target/release/azvpn", dest = "/usr/bin/azvpn", mode = "755" },
    { source = "target/release/azvpnd", dest = "/usr/sbin/azvpnd", mode = "755" },
    { source = "target/openvpn-azvpn/openvpn", dest = "/usr/libexec/azvpn/openvpn", mode = "755" },
    { source = "packaging/deb/azvpn.service", dest = "/lib/systemd/system/azvpn.service", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/azvpn/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/azvpn/LICENSE-APACHE", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/azvpn/README.md", mode = "644" },
]
post_install_script = "packaging/rpm/scripts/post"
pre_uninstall_script = "packaging/rpm/scripts/preun"
post_uninstall_script = "packaging/rpm/scripts/postun"

# systemd is the unit prerequisite. auto-req picks up libc and libdbus
# transitively; declaring systemd explicitly so older RPM tooling that
# doesn't track soname-of-/usr/bin/systemctl still pulls it.
[package.metadata.generate-rpm.requires]
systemd = "*"

[package.metadata.bundle]
name = "azvpn"
identifier = "com.jlevere.azvpn"
category = "public.app-category.utilities"
short_description = "Cross-platform Azure VPN client"
long_description = """
A from-scratch reimplementation of the Microsoft Azure VPN Client as a
portable Rust CLI/library. Connects to Azure Virtual WAN P2S OpenVPN
gateways with Microsoft Entra ID (AAD) or certificate authentication.
"""
# No `osx_minimum_system_version` pin until we test on older macOS; the
# default tracks the current SDK. No `osx_url_schemes` — we don't open
# from `azvpn://` links yet.
# No `osx_info_plist_exts` block — entitlements stay empty until we
# adopt NetworkExtension. We wrap `openvpn`, so no NEKit needed.

[dependencies]
azvpn-auth = { workspace = true }
azvpn-core = { workspace = true }
azvpn-ipc = { workspace = true }
azvpn-profile = { workspace = true }
anyhow = "1"
base64 = { workspace = true }
clap = { workspace = true }
# `-v`/`-vv`/`-q` clap-derive integration. Defaults to WARN; tracing
# feature yields a LevelFilter we feed to EnvFilter. RUST_LOG wins.
clap-verbosity-flag = { version = "3", features = ["tracing"] }
# `azvpn dns lookup` — direct DNS resolver for split-horizon checks.
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
# Byte-size formatting for the `status` traffic line.
humansize = "2"
# Human-readable Duration for uptime / "N ago" lines.
humantime = "2"
if-addrs = { workspace = true }
# epoch-seconds → RFC 3339 for the `whoami` JWT iat/exp lines.
jiff = "0.2"
# Embed git short-commit + build date into `azvpn --version`. Saves
# every support exchange that starts with "what version are you on?"
shadow-rs = { version = "1", default-features = false }
reqwest = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tarpc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# uzers wraps Unix passwd/group lookups (used by install-daemon's
# require_root via geteuid). Unix-only — Windows uses ACLs, not uids.
[target.'cfg(unix)'.dependencies]
uzers = { workspace = true }

# Linux-only — install-daemon talks to org.freedesktop.systemd1 over
# D-Bus to write the unit and start the service without shelling out
# to systemctl.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

# Windows-only — install-daemon registers `azvpnd` with the SCM via
# windows-service's `ServiceManager` (no `sc.exe` shell-out).
# Admin-elevation check via windows-sys token APIs.
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
# `git2` feature is intentionally NOT enabled. shadow-rs would pull in
# `libgit2-sys` to read git metadata; libgit2-sys's vendored C breaks
# against the newer mingw_w64-pthreads in nixpkgs during the Windows
# cross-build (`pthread_mutex_timedlock64` signature mismatch). Without
# `git2`, shadow-rs invokes the `git` binary as a subprocess at build
# time instead — same metadata, no C dep. Build-time shell-outs don't
# violate the runtime no-shelling-out rule, and `git` is on every
# runner image and in the flake's devShell.
shadow-rs = { version = "1", default-features = false, features = ["build"] }

[lints]
workspace = true
