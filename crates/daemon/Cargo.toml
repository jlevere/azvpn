[package]
name = "azvpn-daemon"
version = "0.1.0"
description = "azvpnd — root-side VPN daemon, talks to azvpn CLI over a local socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "azvpnd"
path = "src/main.rs"

[dependencies]
azvpn-auth = { workspace = true }
azvpn-core = { workspace = true }
azvpn-ipc = { workspace = true }
azvpn-openvpn = { workspace = true }
azvpn-profile = { workspace = true }
futures = { workspace = true }
net-route = { workspace = true }
tarpc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
uzers = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
sd-notify = { workspace = true }

# Windows daemon: SCM service shell (windows-service),
# hibernation detector + admin check + GP refresh (windows-sys),
# named-pipe SDDL helpers (widestring), and the rolling-file
# logger that replaces journald on Windows (tracing-appender).
# See docs/windows-plan.md §2.4–§2.8.
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_GroupPolicy",
    "Win32_System_Threading",
] }
widestring = { workspace = true }
tracing-appender = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
