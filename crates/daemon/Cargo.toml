[package]
name = "azvpn-daemon"
version = "0.1.0"
description = "azvpnd — root-side VPN daemon, talks to azvpn CLI over a local socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "azvpnd"
path = "src/main.rs"

[dependencies]
azvpn-core = { workspace = true }
azvpn-ipc = { workspace = true }
azvpn-openvpn = { workspace = true }
azvpn-profile = { workspace = true }
futures = { workspace = true }
net-route = { workspace = true }
tarpc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
uzers = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
sd-notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
