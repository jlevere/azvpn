[package]
name = "azvpn-daemon"
version = "0.2.1"
description = "azvpnd — root-side VPN daemon, talks to azvpn CLI over a local socket"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "azvpnd"
path = "src/main.rs"

[dependencies]
azvpn-auth = { workspace = true }
azvpn-core = { workspace = true }
azvpn-ipc = { workspace = true }
azvpn-openvpn = { workspace = true }
azvpn-profile = { workspace = true }
futures = { workspace = true }
net-route = { workspace = true }
tarpc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Rolling-file logger used on macOS + Windows where the init system
# captures stdout/stderr to an unbounded file. Linux uses journald,
# which rotates itself, so this is dead weight there — but the crate
# is small and target-gating the use sites makes the daemon harder
# to reason about than just keeping it cross-platform.
tracing-appender = { workspace = true }

[target.'cfg(unix)'.dependencies]
uzers = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { workspace = true }
sd-notify = { workspace = true }

# macOS-only — filesystem watch on the daemon binary path so the
# daemon detects `brew upgrade azvpn` and gracefully exits, letting
# launchd's `KeepAlive=true` respawn against the new binary. Linux
# and Windows package managers stop/start the service themselves
# (cargo-deb postinst `try-restart`, WiX `ServiceControl`), so this
# capability isn't needed there.
[target.'cfg(target_os = "macos")'.dependencies]
notify = { workspace = true }

# Windows daemon: SCM service shell (windows-service),
# hibernation detector + admin check + GP refresh (windows-sys),
# named-pipe SDDL helpers (widestring).
[target.'cfg(target_os = "windows")'.dependencies]
windows-service = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_System_GroupPolicy",
    "Win32_System_Threading",
    # `routes::interface_name` does ifindex -> LUID -> alias for the
    # `info` RPC's pretty display of route interfaces on Windows.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }
widestring = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
