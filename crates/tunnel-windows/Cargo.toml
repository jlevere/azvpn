[package]
name = "azvpn-tunnel-windows"
version = "0.1.0"
description = "Windows Wintun tunnel and NRPT DNS management"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# All payload deps are Windows-only. The crate as a whole is
# `#![cfg(target_os = "windows")]`, but cargo still resolves these
# on other platforms — gating here keeps `cargo metadata` /
# cargo-deny clean on macOS and Linux.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_GroupPolicy",
    "Win32_Security",
    # `CoCreateGuid` in nrpt::new_guid_string.
    "Win32_System_Com",
] }
# Dnscache service-running probe in `nrpt::dnscache_running`.
windows-service = { workspace = true }
winreg = { workspace = true }

[lints]
workspace = true
