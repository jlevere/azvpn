[package]
name = "azvpn-tunnel-windows"
version = "0.2.1"
description = "Windows Wintun tunnel and NRPT DNS management"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
# `tokio::sync::mpsc::UnboundedReceiver` shape returned by `power::watch`
# so the netmon composer can treat all three platforms uniformly. No
# tokio runtime work happens in this crate; the receiver is inert
# (never produces) because Windows uses wall-clock-jump in the netmon
# composer as its primary sleep/wake signal.
tokio = { workspace = true }
tracing = { workspace = true }

# All payload deps are Windows-only. The crate as a whole is
# `#![cfg(target_os = "windows")]`, but cargo still resolves these
# on other platforms — gating here keeps `cargo metadata` /
# cargo-deny clean on macOS and Linux.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_GroupPolicy",
    "Win32_Security",
] }
# Dnscache service-running probe in `nrpt::dnscache_running`.
windows-service = { workspace = true }
winreg = { workspace = true }
# UUID v4 for NRPT rule subkey names. Pure Rust; no Win32 call.
uuid = { workspace = true }

[lints]
workspace = true
