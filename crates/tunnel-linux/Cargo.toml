[package]
name = "azvpn-tunnel-linux"
version = "0.2.3"
description = "Linux TUN tunnel and systemd-resolved DNS management"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# StreamExt::next() for consuming the zbus `PrepareForSleep` signal
# stream in `power.rs`.
futures = { workspace = true }
if-addrs = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
# mpsc::UnboundedSender for the logind signal task to feed wake events
# back to the netmon composer.
tokio = { workspace = true }
tracing = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `p2p` lets the resolved proxy test serve a fake resolve1 object over
# a socket pair instead of the system bus.
zbus = { workspace = true, features = ["p2p"] }

[lints]
workspace = true
