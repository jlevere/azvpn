[package]
name = "azvpn-ipc"
version = "0.1.0"
description = "Service trait + serializable wire types shared between azvpn (CLI) and azvpnd (daemon)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
azvpn-openvpn = { workspace = true }
azvpn-profile = { workspace = true }
ipnet = { workspace = true }
serde = { workspace = true }
tarpc = { workspace = true }
thiserror = { workspace = true }

# Windows transport (W1.3): named-pipe bind/connect via
# `tokio::net::windows::named_pipe::*`. The codec stack
# (LengthDelimitedCodec + Bincode) sits one layer above and stays
# platform-agnostic.
#
# windows-sys is wired (but not yet used) for the SDDL helper that
# will land alongside non-admin RPC support — sets a
# `D:(A;;GA;;;BA)(A;;GRGW;;;BU)` ACL via
# `ConvertStringSecurityDescriptorToSecurityDescriptorW` and
# passes the result through `ServerOptions::security_attributes`.
[target.'cfg(target_os = "windows")'.dependencies]
tokio = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    # `GetCurrentThread` for the impersonation/OpenThreadToken cycle
    # in `identity::fetch_pipe_identity`.
    "Win32_System_Threading",
] }
widestring = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
