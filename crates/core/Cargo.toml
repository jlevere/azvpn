[package]
name = "azvpn-core"
version = "0.1.0"
description = "Core connection lifecycle and orchestration"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
azvpn-auth = { workspace = true }
# Wire-type crate. We don't talk over the wire from core, but
# `ByteCount` / `Throughput` live there as the daemon-↔-CLI contract,
# and `core::metrics` builds those same shapes so the daemon can hand
# them off without conversion at status-RPC time.
azvpn-ipc = { workspace = true }
azvpn-openvpn = { workspace = true }
azvpn-profile = { workspace = true }
backon = { workspace = true }
futures = { workspace = true }
if-watch = { workspace = true }
ipnet = { workspace = true }
libc = { workspace = true }
net-route = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
azvpn-tunnel-darwin = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
azvpn-tunnel-linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
azvpn-tunnel-windows = { workspace = true }

[lints]
workspace = true
