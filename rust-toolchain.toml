[toolchain]
channel = "stable"
components = ["rustfmt", "clippy", "rust-analyzer"]
# Cross-compile target pulled into the toolchain by
# `pkgs.rust-bin.fromRustupToolchainFile` (the rust-std for the triple
# lands in the nix-built toolchain). Required by `nix build
# .#azvpn-windows-cross` (and the MSI derivation built on top of it),
# which compiles the workspace for x86_64-pc-windows-gnu from a Linux
# host via the mingw cross-toolchain.
#
# We don't cross-compile to macOS — `release.yml`'s `build-macos` job
# runs natively on `macos-latest` (free for public repos under
# standard-runner billing), so there's no need to carry the Darwin
# rust-std here.
targets = ["x86_64-pc-windows-gnu"]
