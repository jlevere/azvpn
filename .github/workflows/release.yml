name: Release

on:
  push:
    tags: ["v*"]
  # Manual dispatch so we can produce artifacts for testing without
  # cutting a real tag — useful when iterating on the packaging
  # pipeline (Tier 2.x: cargo-deb / cargo-generate-rpm).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) — not ubuntu-latest (24.04 / glibc 2.39).
          # 22.04's glibc is old enough that the resulting binary runs on
          # Debian 12 (2.36), Ubuntu 22.04+, RHEL 9 (2.34 — symbol-versioning
          # still works), Amazon Linux 2023, etc. ubuntu-latest would
          # produce a binary that apt rejects on Debian 12 with
          # "libc6 (>= 2.39) but 2.36-9+deb12u13 is to be installed".
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: azvpn-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: azvpn-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: azvpn-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Include matrix.os in the cache key — the default key keys
          # on target + rustc + lockfile, NOT the runner OS, so a
          # cache built on ubuntu-latest (24.04 / glibc 2.39) gets
          # reused on ubuntu-22.04 (glibc 2.35), then fails to link.
          key: release-${{ matrix.os }}-${{ matrix.target }}
      # libdbus-1-dev: the keyring crate's sync-secret-service feature
      # links to system libdbus on Linux (not pure-Rust like zbus). The
      # macOS / Windows runners pick a native backend and don't need it.
      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/azvpn"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "${src}.exe" "${{ matrix.artifact }}.exe"
          else
            mv "$src" "${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  # Patched openvpn binary for Linux .deb / .rpm packaging.
  #
  # We bundle a private openvpn at /usr/libexec/azvpn/openvpn rather than
  # depending on the distro's package because Azure P2S gateways require
  # USER_PASS_LEN and TLS_CHANNEL_BUF_SIZE bumps to fit AAD bearer tokens
  # — stock openvpn 2.6 truncates them and the TLS handshake fails. The
  # patch lives at patches/openvpn-increase-user-pass-len.patch.
  #
  # Static (musl) link so one binary works on every supported glibc
  # without per-distro builds.
  build-openvpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build static openvpn
        run: nix build .#openvpn-azvpn-static --print-build-logs
      - name: Stage binary
        run: |
          mkdir -p out
          cp result/sbin/openvpn out/openvpn-azvpn-linux-x86_64 \
            || cp result/bin/openvpn out/openvpn-azvpn-linux-x86_64
          chmod +x out/openvpn-azvpn-linux-x86_64
          file out/openvpn-azvpn-linux-x86_64
          ./out/openvpn-azvpn-linux-x86_64 --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-azvpn-linux-x86_64
          path: out/openvpn-azvpn-linux-x86_64

  # Debian package — bundles azvpn + azvpnd + the patched static openvpn
  # + a systemd unit + maintainer scripts that create the azvpn group.
  # The actual cargo-deb metadata lives in crates/cli/Cargo.toml.
  build-deb:
    needs: build-openvpn
    # ubuntu-22.04 (glibc 2.35) for the same reason as the matrix build
    # above — the .deb's `$auto` Depends line resolves to the build
    # host's glibc version, and Debian 12 ships 2.36.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Pin to runner OS so a previous ubuntu-latest cache doesn't
          # carry glibc-2.39-linked artifacts into a 22.04 build.
          key: build-deb-ubuntu-22.04
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release binaries (host triple)
        # cargo-deb looks under target/release/, not target/<triple>/release/,
        # so we drop the --target flag the matrix-build step uses.
        run: cargo build --release -p azvpn -p azvpn-daemon
      - name: Stage bundled openvpn
        uses: actions/download-artifact@v4
        with:
          name: openvpn-azvpn-linux-x86_64
          path: target/openvpn-azvpn-staged
      - name: Move openvpn into the path cargo-deb expects
        run: |
          mkdir -p target/openvpn-azvpn
          mv target/openvpn-azvpn-staged/openvpn-azvpn-linux-x86_64 target/openvpn-azvpn/openvpn
          chmod +x target/openvpn-azvpn/openvpn
      - name: Build .deb
        run: cargo deb -p azvpn --no-build --output target/debian/
      - name: List produced .deb
        run: ls -la target/debian/
      - uses: actions/upload-artifact@v4
        with:
          name: azvpn-deb-linux-x86_64
          path: target/debian/*.deb

  release:
    needs: [build, build-openvpn, build-deb]
    # Only publish a GH release on tag pushes — manual dispatches still
    # produce artifacts (visible from the run page) but don't create
    # a draft release out of nowhere.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
