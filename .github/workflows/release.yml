name: Release

on:
  push:
    tags: ["v*"]
  # Manual dispatch so we can produce artifacts for testing without
  # cutting a real tag — useful when iterating on the packaging
  # pipeline (Tier 2.x: cargo-deb / cargo-generate-rpm).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Bare Linux CLI binary — used directly by anyone who doesn't want
  # the .deb / .rpm. macOS is `build-macos`, Windows is `build-msi`;
  # both produce installer-style artifacts (tarball / MSI) instead of
  # standalone binaries, because that's what their package managers
  # consume.
  build:
    runs-on: ubuntu-22.04
    # ubuntu-22.04 (glibc 2.35) — not ubuntu-latest (24.04 / glibc 2.39).
    # 22.04's glibc is old enough that the resulting binary runs on
    # Debian 12 (2.36), Ubuntu 22.04+, RHEL 9 (2.34 — symbol-versioning
    # still works), Amazon Linux 2023, etc. ubuntu-latest would
    # produce a binary that apt rejects on Debian 12 with
    # "libc6 (>= 2.39) but 2.36-9+deb12u13 is to be installed".
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          # Include OS in the cache key — the default key keys on
          # target + rustc + lockfile, NOT the runner OS, so a cache
          # built on ubuntu-latest (24.04 / glibc 2.39) gets reused on
          # ubuntu-22.04 (glibc 2.35), then fails to link.
          key: release-ubuntu-22.04-x86_64-unknown-linux-gnu
      # libdbus-1-dev: the keyring crate's sync-secret-service feature
      # links to system libdbus on Linux (not pure-Rust like zbus).
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - name: Rename binary
        run: mv target/x86_64-unknown-linux-gnu/release/azvpn azvpn-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: azvpn-linux-x86_64
          path: azvpn-linux-x86_64

  # macOS release tarball — what `brew install jlevere/tap/azvpn`
  # consumes. The whole flow (cargo build, nix build of patched
  # openvpn, stage bin/+libexec/, tar, sha256, write CI outputs)
  # lives in `cargo xtask release-macos` — see crates/xtask/.
  # Putting the orchestration in Rust means we can unit-test the
  # layout against the formula's `install` block; the YAML here
  # is now just the runner setup.
  build-macos:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
      tarball_name: ${{ steps.tarball.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-macos-aarch64
      # Nix is needed for the patched openvpn — `pkgsCross` /
      # the openvpn-azvpn derivation in flake.nix. Magic-nix-cache
      # gives a fresh runner a populated store within seconds.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build release tarball
        id: tarball
        run: cargo xtask release-macos --emit-ci-outputs
      - uses: actions/upload-artifact@v4
        with:
          name: azvpn-macos-aarch64
          path: dist/azvpn-*-aarch64-apple-darwin.tar.gz

  # Windows MSI installer — what `scoop install azvpn` (and direct
  # downloads from the release page) consumes. The build orchestration
  # — mingw cross-compile via nix → wixl-built MSI → Authenticode
  # signing via osslsigncode — lives in `cargo xtask release-windows`.
  # Runs on ubuntu-latest because nix's `pkgsCross.mingwW64` does the
  # cross-build; no actual Windows runner needed.
  #
  # Authenticode signing is conditional on `WINDOWS_SIGNING_CERT_B64`
  # being set as a repo secret:
  #
  #   - WINDOWS_SIGNING_CERT_B64 — base64 of the PEM signing cert
  #   - WINDOWS_SIGNING_KEY_B64  — base64 of the PEM private key
  #
  # `base64 -w0 cert.pem | pbcopy` (or `xclip -sel clip`) gets them
  # into the secret value at https://github.com/jlevere/azvpn/settings/secrets/actions.
  # When neither is set the job still runs and uploads an unsigned MSI
  # — useful for dispatch-run smoke tests before code-signing is set up.
  build-msi:
    runs-on: ubuntu-latest
    # GHA disallows `secrets.*` references inside step-level `if:`
    # — they're only allowed in `env:`, `with:`, and run-script
    # bodies. So we materialize "have signing material?" into a
    # job-env string ("true"/"false") and gate steps on `env.*`.
    env:
      HAS_SIGNING: ${{ secrets.WINDOWS_SIGNING_CERT_B64 != '' }}
    outputs:
      version: ${{ steps.msi.outputs.version }}
      sha256: ${{ steps.msi.outputs.sha256 }}
      msi_name: ${{ steps.msi.outputs.msi_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-msi-ubuntu-latest
      # xtask transitively depends on `azvpn-core` → `azvpn-auth` →
      # `keyring`'s sync-secret-service feature → `libdbus-sys`, which
      # needs `libdbus-1-dev` + pkg-config to link on Linux. The macOS
      # and Windows keyring backends are pure-FFI to system frameworks
      # so this only bites Linux runners that compile xtask.
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # osslsigncode only needs to be present when we're actually
      # signing — saves ~5s on the no-secret unsigned-build path.
      - name: Install osslsigncode
        if: env.HAS_SIGNING == 'true'
        run: sudo apt-get update && sudo apt-get install -y osslsigncode
      # Decode the base64 secrets to tempfiles on disk. `umask 077`
      # makes them mode 0600 — the GH runner is short-lived but it
      # still doesn't hurt to be tidy with private keys.
      - name: Stage signing material
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_B64: ${{ secrets.WINDOWS_SIGNING_CERT_B64 }}
          KEY_B64: ${{ secrets.WINDOWS_SIGNING_KEY_B64 }}
        run: |
          umask 077
          mkdir -p /tmp/sign
          echo "$CERT_B64" | base64 -d > /tmp/sign/cert.pem
          echo "$KEY_B64" | base64 -d > /tmp/sign/key.pem
          echo "AZVPN_SIGNING_CERT=/tmp/sign/cert.pem" >> "$GITHUB_ENV"
          echo "AZVPN_SIGNING_KEY=/tmp/sign/key.pem"   >> "$GITHUB_ENV"
      # `SIGN_FLAG` expands to `--sign` when signing material was
      # staged, empty otherwise. Shell empty-expansion drops it from
      # the command line so xtask sees plain `release-windows --emit-ci-outputs`.
      - name: Build MSI
        id: msi
        env:
          SIGN_FLAG: ${{ env.HAS_SIGNING == 'true' && '--sign' || '' }}
        run: cargo xtask release-windows $SIGN_FLAG --emit-ci-outputs
      - uses: actions/upload-artifact@v4
        with:
          name: azvpn-msi-x86_64
          path: dist/azvpn-*-x86_64-windows.msi

  # Patched openvpn binary for Linux .deb / .rpm packaging.
  #
  # We bundle a private openvpn at /usr/libexec/azvpn/openvpn rather than
  # depending on the distro's package because Azure P2S gateways require
  # USER_PASS_LEN and TLS_CHANNEL_BUF_SIZE bumps to fit AAD bearer tokens
  # — stock openvpn 2.6 truncates them and the TLS handshake fails. The
  # patch lives at patches/openvpn-increase-user-pass-len.patch.
  #
  # Static (musl) link so one binary works on every supported glibc
  # without per-distro builds.
  build-openvpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build static openvpn
        run: nix build .#openvpn-azvpn-static --print-build-logs
      - name: Stage binary
        run: |
          mkdir -p out
          cp result/sbin/openvpn out/openvpn-azvpn-linux-x86_64 \
            || cp result/bin/openvpn out/openvpn-azvpn-linux-x86_64
          chmod +x out/openvpn-azvpn-linux-x86_64
          file out/openvpn-azvpn-linux-x86_64
          ./out/openvpn-azvpn-linux-x86_64 --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: openvpn-azvpn-linux-x86_64
          path: out/openvpn-azvpn-linux-x86_64

  # Debian package — bundles azvpn + azvpnd + the patched static openvpn
  # + a systemd unit + maintainer scripts that create the azvpn group.
  # The actual cargo-deb metadata lives in crates/cli/Cargo.toml.
  build-deb:
    needs: build-openvpn
    # ubuntu-22.04 (glibc 2.35) for the same reason as the matrix build
    # above — the .deb's `$auto` Depends line resolves to the build
    # host's glibc version, and Debian 12 ships 2.36.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Pin to runner OS so a previous ubuntu-latest cache doesn't
          # carry glibc-2.39-linked artifacts into a 22.04 build.
          key: build-deb-ubuntu-22.04
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build release binaries (host triple)
        # cargo-deb looks under target/release/, not target/<triple>/release/,
        # so we drop the --target flag the matrix-build step uses.
        run: cargo build --release -p azvpn -p azvpn-daemon
      - name: Stage bundled openvpn
        uses: actions/download-artifact@v8
        with:
          name: openvpn-azvpn-linux-x86_64
          path: target/openvpn-azvpn-staged
      - name: Move openvpn into the path cargo-deb expects
        run: |
          mkdir -p target/openvpn-azvpn
          mv target/openvpn-azvpn-staged/openvpn-azvpn-linux-x86_64 target/openvpn-azvpn/openvpn
          chmod +x target/openvpn-azvpn/openvpn
      - name: Build .deb
        run: cargo deb -p azvpn --no-build --output target/debian/
      - name: List produced .deb
        run: ls -la target/debian/
      - uses: actions/upload-artifact@v4
        with:
          name: azvpn-deb-linux-x86_64
          path: target/debian/*.deb

  # RPM-family package — same shape as build-deb but produces a .rpm
  # via cargo-generate-rpm. Targets Fedora 39+, RHEL 9, Amazon Linux
  # 2023. Reuses the openvpn artifact + systemd unit + the host-built
  # azvpn / azvpnd binaries from the same release profile.
  build-rpm:
    needs: build-openvpn
    # ubuntu-22.04 (glibc 2.35) for the same reason as build-deb: the
    # binaries' auto-detected sonames need to be old enough to install
    # on RHEL 9 (glibc 2.34) and Fedora's current stable.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-rpm-ubuntu-22.04
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binaries (host triple)
        # Same host-triple build cargo-deb uses; cargo-generate-rpm
        # also looks under target/release/ by default.
        run: cargo build --release -p azvpn -p azvpn-daemon
      - name: Stage bundled openvpn
        uses: actions/download-artifact@v8
        with:
          name: openvpn-azvpn-linux-x86_64
          path: target/openvpn-azvpn-staged
      - name: Move openvpn into the path the manifest expects
        run: |
          mkdir -p target/openvpn-azvpn
          mv target/openvpn-azvpn-staged/openvpn-azvpn-linux-x86_64 target/openvpn-azvpn/openvpn
          chmod +x target/openvpn-azvpn/openvpn
      - name: Build .rpm
        run: |
          mkdir -p target/generate-rpm
          cargo generate-rpm -p crates/cli --output target/generate-rpm/
      - name: List produced .rpm
        run: ls -la target/generate-rpm/
      - uses: actions/upload-artifact@v4
        with:
          name: azvpn-rpm-linux-x86_64
          path: target/generate-rpm/*.rpm

  release:
    needs: [build, build-macos, build-msi, build-openvpn, build-deb, build-rpm]
    # Only publish a GH release on tag pushes — manual dispatches still
    # produce artifacts (visible from the run page) but don't create
    # a draft release out of nowhere.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # After the release lands, template the Homebrew formula with this
  # release's version + sha256 and PUT it into jlevere/homebrew-tap
  # so `brew install jlevere/tap/azvpn` resolves the new tarball.
  #
  # Auth is via a GitHub App installation token (no PAT rotation pain).
  # Setup:
  #   1. Have a GitHub App with `Contents: read & write` permission.
  #   2. Install it on BOTH `jlevere/azvpn` (so this workflow can mint
  #      tokens) and `jlevere/homebrew-tap` (so the token has push
  #      access there).
  #   3. Add two repo secrets at
  #      https://github.com/jlevere/azvpn/settings/secrets/actions:
  #        - HOMEBREW_TAP_APP_ID    = the App's numeric ID
  #        - HOMEBREW_TAP_APP_KEY   = the App's private key (.pem)
  # The default `GITHUB_TOKEN` is per-repo; can't reach the tap.
  # `needs: release` so we don't push a formula pointing at a tarball
  # URL that doesn't exist yet.
  publish-formula:
    needs: [build-macos, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-formula-ubuntu
      # Same Linux libdbus dep as build-msi: xtask transitively pulls
      # in libdbus-sys via azvpn-core → azvpn-auth → keyring.
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # Mint a short-lived installation access token scoped to just
      # the tap repo. `owner` + `repositories` narrow the token below
      # the App's full installation reach — defence in depth.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_KEY }}
          owner: jlevere
          repositories: homebrew-tap
      - name: Push templated formula to tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          cargo xtask publish-formula \
            --version "${{ needs.build-macos.outputs.version }}" \
            --sha256 "${{ needs.build-macos.outputs.sha256 }}" \
            --push
