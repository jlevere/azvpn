name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is intentionally absent — it's 10× the per-minute
        # rate, and the dev workflow already exercises macOS continuously.
        # macOS clippy/test for release validation runs in `release.yml`'s
        # build-macos job (cross-compiled on Linux via cargo-zigbuild) or
        # on the maintainer's machine. PRs touching macOS-specific code
        # paths get tagged `macos-check` to opt-in to a manual macOS run.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # libdbus-1-dev — keyring's sync-secret-service feature links to
      # the system libdbus on Linux. macOS / Windows use native backends.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --all-targets

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is intentionally absent — it's 10× the per-minute
        # rate, and the dev workflow already exercises macOS continuously.
        # macOS clippy/test for release validation runs in `release.yml`'s
        # build-macos job (cross-compiled on Linux via cargo-zigbuild) or
        # on the maintainer's machine. PRs touching macOS-specific code
        # paths get tagged `macos-check` to opt-in to a manual macOS run.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
